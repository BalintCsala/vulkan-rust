[package]
name = "vulkan-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
bevy = { version = "0.18", features = [
  "bevy_window",
  "bevy_winit",
  "debug",
], default-features = false }
bytemuck = "1.24.0"
image = "0.25.10"
serde = "1.0.228"
serde_json = "1.0.149"
vk-mem = { git = "https://github.com/gwihlidal/vk-mem-rs", branch = "master" }
winit = "0.30.12"
vulkan_utils = { path = "vulkan_utils" }

[build-dependencies]
vulkan_utils = { path = "vulkan_utils" }

[workspace]
members = ["vulkan_utils"]

[patch.crates-io]
glam = { git = "https://github.com/BalintCsala/glam-rs.git", branch = "perspective-vulkan-0.30.10" }
