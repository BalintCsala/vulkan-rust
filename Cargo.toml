[workspace]
members = ["app", "crates/assets", "crates/renderer", "crates/vulkan-utils"]
resolver = "3"

[workspace.dependencies]
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
bevy = { version = "0.18", features = [
  "bevy_window",
  "bevy_winit",
  "debug",
], default-features = false }
bytemuck = "1.24.0"
image = "0.25.10"
serde = "1.0.228"
serde_json = "1.0.149"
vk-mem = { git = "https://github.com/gwihlidal/vk-mem-rs", branch = "master" }
winit = "0.30.12"
assets = { path = "crates/assets" }
renderer = { path = "crates/renderer" }
vulkan_utils = { path = "crates/vulkan-utils" }
anyhow = "1.0.104"

[patch.crates-io]
glam = { git = "https://github.com/BalintCsala/glam-rs.git", branch = "perspective-vulkan-0.30.10" }
